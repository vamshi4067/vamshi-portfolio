<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Explore real Salesforce Lightning Web Components through a field-service booking demo. Inspect the LWC and Apex source."
    />
    <meta name="theme-color" content="#0176d3" />
    <title>Service Studio — Salesforce LWC & Apex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: Studio;
        src: url("assets/studio.woff2");
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f3f3;
        color: #181818;
        font-family: "Inter Tight", Studio, "Segoe UI", sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        caret-color: #0176d3;
      }
      ::selection {
        background: #e9d1bf;
        color: #181818;
      }
      * {
        scrollbar-color: #a5a79f #f3f3f3;
        scrollbar-width: thin;
      }
      #app {
        min-height: 100vh;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      html {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript
      >This interactive LWC portfolio needs JavaScript enabled.</noscript
    >
    <script type="module" src="assets/app.js?v=availability-2"></script>
  </body>
</html>
